name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: lifesystemsufpr/devops-hub/.github/workflows/ci-node-backend.yml@main
    with:
      node-version: '22'
      package-manager: 'npm'
      coverage-threshold: 60
      setup-command: 'npx prisma generate'
    secrets: inherit
